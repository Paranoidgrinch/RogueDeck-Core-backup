name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RogueDeck.slnx

      - name: Build
        run: dotnet build RogueDeck.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RogueDeck.slnx --configuration Release --no-build
